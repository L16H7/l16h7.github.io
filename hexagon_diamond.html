
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #533483 100%); }
  .container { width: 100%; margin: 0 auto; padding: 12px; font-family: var(--font-sans, system-ui, sans-serif); }
  h2 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  .subtitle { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 1rem; }
  .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .tool-btn { padding: 14px 8px; border: 2px solid rgba(255,255,255,0.15); border-radius: 14px; cursor: pointer; font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.1); color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s, border-color 0.15s; backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; }
  .tool-btn svg { flex-shrink: 0; width: 18px; height: 18px; }
  .tool-btn.active { border-color: #a78bfa; background: rgba(167,139,250,0.25); }
  .tool-btn:hover { background: rgba(255,255,255,0.18); }
  .tool-count { font-size: 11px; color: #1a1a2e; min-width: 20px; text-align: center; background: #a78bfa; border-radius: 10px; padding: 2px 6px; font-weight: 700; }
  .toolbar2 { display: flex; gap: 8px; margin-bottom: 1rem; align-items: stretch; }
  .n-stepper { flex: 1; display: flex; align-items: center; border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); backdrop-filter: blur(6px); }
  .n-step-btn { flex: 1; height: 52px; border: none; background: transparent; cursor: pointer; font-size: 28px; color: #a78bfa; font-weight: 300; display: flex; align-items: center; justify-content: center; transition: background 0.15s; line-height: 1; -webkit-tap-highlight-color: transparent; }
  .n-step-btn:hover { background: rgba(167,139,250,0.2); }
  .n-val { min-width: 40px; text-align: center; font-size: 16px; font-weight: 700; color: #fff; }
  .reset-btn { flex: 1; padding: 0 16px; border: 2px solid rgba(255,100,100,0.4); border-radius: 14px; cursor: pointer; font-size: 14px; background: rgba(255,100,100,0.15); color: #ff9999; font-weight: 600; transition: background 0.15s; backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; height: 52px; }
  .reset-btn:hover { background: rgba(255,100,100,0.28); }
  .board-wrap { background: rgba(255,255,255,0.92); border-radius: 16px; padding: 10px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
  svg { display: block; width: 100%; height: auto; }
  .stats { display: flex; gap: 8px; margin-top: 1rem; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px 18px; font-size: 13px; color: rgba(255,255,255,0.75); backdrop-filter: blur(6px); }
  .stat span { font-weight: 700; color: #fff; }
  @media (min-width: 600px) {
    .container { max-width: 600px; padding: 24px; }
    h2 { font-size: 26px; }
    .subtitle { font-size: 14px; }
    .tool-btn { padding: 12px 8px; font-size: 14px; }
    .tool-btn svg { width: 18px; height: 18px; }
    .n-step-btn { height: 44px; font-size: 22px; }
    .reset-btn { height: 44px; font-size: 14px; }
    .board-wrap { padding: 16px; }
    .stat { font-size: 14px; }
  }
</style>

<div class="container">
  <h2>Diamonds in a hexagon</h2>
  <p class="subtitle">Select a diamond orientation, then click to place. Click a placed diamond to remove it.</p>
  <div class="toolbar">
    <button class="tool-btn active" data-tool="0" onclick="selectTool(0)">
      <svg width="14" height="16" viewBox="0 0 14 16"><polygon points="7,0 14,8 7,16 0,8" fill="#E24B4A"/></svg>
      Vertical <span class="tool-count" id="cnt0">0</span>
    </button>
    <button class="tool-btn" data-tool="1" onclick="selectTool(1)">
      <svg width="18" height="11" viewBox="0 0 22 14"><polygon points="5,0 22,0 17,14 0,14" fill="#378ADD"/></svg>
      Left <span class="tool-count" id="cnt1">0</span>
    </button>
    <button class="tool-btn" data-tool="2" onclick="selectTool(2)">
      <svg width="18" height="11" viewBox="0 0 22 14"><polygon points="0,0 17,0 22,14 5,14" fill="#639922"/></svg>
      Right <span class="tool-count" id="cnt2">0</span>
    </button>
  </div>
  <div class="toolbar2">
    <div class="n-stepper">
      <button class="n-step-btn" onclick="changeN(N-1)">−</button>
      <span class="n-val" id="nVal">4</span>
      <button class="n-step-btn" onclick="changeN(N+1)">+</button>
    </div>
    <button class="reset-btn" onclick="resetBoard()">Clear</button>
  </div>
  <div class="board-wrap"><svg id="board"></svg></div>
  <div class="stats">
    <div class="stat">Total: <span id="count">0</span></div>
  </div>
</div>

<script>
const S = 30;
const H = S * Math.sqrt(3) / 2;
const colors = ['#E24B4A', '#378ADD', '#639922'];
const hoverColors = ['rgba(226,75,74,0.25)', 'rgba(55,138,221,0.25)', 'rgba(99,153,34,0.25)'];

let currentTool = 0;
let grid = {};
let diamonds = [];
let triToDiamond = {};
let allTris = [];

let N = 4;
let rowConfig = buildRowConfig(N);

function buildRowConfig(n) {
  const rows = [];
  for (let i = 0; i < n; i++) {
    rows.push({ count: 2 * n + 1 + 2 * i, xOffset: (n - 1 - i) * S / 2 });
  }
  for (let i = n - 1; i >= 0; i--) {
    rows.push({ count: 2 * n + 1 + 2 * i, xOffset: (n - 1 - i) * S / 2 });
  }
  return rows;
}

function isUpTri(r, c) { return r < N ? c % 2 === 0 : c % 2 !== 0; }

function getTriPts(r, c) {
  const cfg = rowConfig[r];
  const up = isUpTri(r, c);
  const x = cfg.xOffset + c * S / 2;
  const y = r * H;
  if (up) return [[x, y + H], [x + S / 2, y], [x + S, y + H]];
  else return [[x, y], [x + S, y], [x + S / 2, y + H]];
}

function buildGrid() {
  allTris = [];
  grid = {};
  for (let r = 0; r < rowConfig.length; r++) {
    for (let c = 0; c < rowConfig[r].count; c++) {
      const up = isUpTri(r, c);
      const pts = getTriPts(r, c);
      const key = `${r}-${c}`;
      const tri = { r, c, up, pts, key };
      allTris.push(tri);
      grid[key] = tri;
    }
  }
}

let neighborMaps = [{}, {}, {}];
let allDiamondPairs = [[], [], []];

function buildNeighborMaps() {
  neighborMaps = [{}, {}, {}];
  const edgeMap = {};
  for (const tri of allTris) {
    const pts = tri.pts;
    const edges = [[pts[0], pts[1]], [pts[1], pts[2]], [pts[0], pts[2]]];
    for (const [a, b] of edges) {
      const mx = Math.round((a[0] + b[0]) * 100);
      const my = Math.round((a[1] + b[1]) * 100);
      const ek = `${mx},${my}`;
      if (!edgeMap[ek]) edgeMap[ek] = [];
      edgeMap[ek].push(tri);
    }
  }
  for (const ek in edgeMap) {
    const tris = edgeMap[ek];
    if (tris.length !== 2) continue;
    const [t1, t2] = tris;
    if (t1.up === t2.up) continue;
    const pts1 = t1.pts;
    let sharedEdge = null;
    for (const [a1, b1] of [[pts1[0],pts1[1]],[pts1[1],pts1[2]],[pts1[0],pts1[2]]]) {
      const emx = Math.round((a1[0]+b1[0])*100);
      const emy = Math.round((a1[1]+b1[1])*100);
      if (`${emx},${emy}` === ek) { sharedEdge = [a1, b1]; break; }
    }
    if (!sharedEdge) continue;
    const dx = sharedEdge[1][0] - sharedEdge[0][0];
    const dy = sharedEdge[1][1] - sharedEdge[0][1];
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const na = ((Math.round(angle) % 360) + 360) % 360;
    let type;
    if (na < 10 || na > 350 || (na > 170 && na < 190)) type = 0;
    else if ((na > 50 && na < 70) || (na > 230 && na < 250)) type = 1;
    else if ((na > 110 && na < 130) || (na > 290 && na < 310)) type = 2;
    else continue;
    neighborMaps[type][t1.key] = t2.key;
    neighborMaps[type][t2.key] = t1.key;
  }
}

function buildAllDiamondPairs() {
  for (let t = 0; t < 3; t++) {
    const seen = new Set();
    const pairs = [];
    for (const key in neighborMaps[t]) {
      const partnerKey = neighborMaps[t][key];
      const pairKey = [key, partnerKey].sort().join('|');
      if (!seen.has(pairKey)) {
        seen.add(pairKey);
        pairs.push([key, partnerKey]);
      }
    }
    allDiamondPairs[t] = pairs;
  }
}

function getDiamondOutlinePts(tri1, tri2) {
  const allPts = [...tri1.pts, ...tri2.pts];
  const unique = [];
  for (const p of allPts) {
    if (!unique.some(u => Math.abs(u[0] - p[0]) < 0.01 && Math.abs(u[1] - p[1]) < 0.01)) {
      unique.push(p);
    }
  }
  const cx = unique.reduce((s, p) => s + p[0], 0) / unique.length;
  const cy = unique.reduce((s, p) => s + p[1], 0) / unique.length;
  unique.sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx));
  return unique;
}

function getPartner(tri, tool) {
  const nk = neighborMaps[tool][tri.key];
  if (!nk) return null;
  const p = grid[nk];
  if (!p || triToDiamond[p.key] !== undefined) return null;
  return p;
}

function placeDiamond(tri, partner, tool) {
  const dIdx = diamonds.length;
  diamonds.push({ tri1: tri.key, tri2: partner.key, color: tool });
  triToDiamond[tri.key] = dIdx;
  triToDiamond[partner.key] = dIdx;
}

function removeDiamond(dIdx) {
  const d = diamonds[dIdx];
  if (!d) return;
  delete triToDiamond[d.tri1];
  delete triToDiamond[d.tri2];
  diamonds[dIdx] = null;
}

function countByType() {
  const c = [0,0,0];
  for (const d of diamonds) if (d !== null) c[d.color]++;
  return c;
}

// Collect all unique edges for grid lines
let gridLines = [];
let hexOutlinePts = '';

function buildGridLines() {
  gridLines = [];
  const edgeSet = {};
  for (const tri of allTris) {
    const pts = tri.pts;
    const edges = [[pts[0], pts[1]], [pts[1], pts[2]], [pts[0], pts[2]]];
    for (const [a, b] of edges) {
      const k1 = `${Math.round(a[0]*10)},${Math.round(a[1]*10)}-${Math.round(b[0]*10)},${Math.round(b[1]*10)}`;
      const k2 = `${Math.round(b[0]*10)},${Math.round(b[1]*10)}-${Math.round(a[0]*10)},${Math.round(a[1]*10)}`;
      if (!edgeSet[k1] && !edgeSet[k2]) {
        edgeSet[k1] = true;
        gridLines.push([a, b]);
      }
    }
  }
}

function buildHexOutline() {
  const midRow = N - 1;
  const lastRow = 2 * N - 1;
  const r0 = rowConfig[0];
  const rMid = rowConfig[midRow];
  const rLast = rowConfig[lastRow];

  const topLeftApex = [r0.xOffset + S/2, 0];
  const lastUpC0 = r0.count - 2 + (r0.count % 2);
  const topRightApex = [r0.xOffset + lastUpC0 * S/2 + S/2, 0];

  const midY = midRow * H;
  const midLeft = [rMid.xOffset, midY + H];
  const midRight = [rMid.xOffset + Math.ceil(rMid.count/2) * S, midY + H];

  const botY = lastRow * H;
  const botLeftApex = [rLast.xOffset + S/2, botY + H];
  const lastUpCLast = rLast.count - 2 + (rLast.count % 2);
  const botRightApex = [rLast.xOffset + lastUpCLast * S/2 + S/2, botY + H];

  // Regular hexagon: 6 corners
  // top-left, top-right, mid-right, bot-right, bot-left, mid-left
  const pts = [
    topLeftApex, topRightApex,
    midRight,
    botRightApex, botLeftApex,
    midLeft
  ];
  hexOutlinePts = pts.map(p => `${p[0]},${p[1]}`).join(' ');
}

function render() {
  const svg = document.getElementById('board');

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const tri of allTris) {
    for (const p of tri.pts) {
      if (p[0] < minX) minX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] > maxY) maxY = p[1];
    }
  }
  const pad = 6;
  svg.setAttribute('viewBox', `${minX-pad} ${minY-pad} ${maxX-minX+2*pad} ${maxY-minY+2*pad}`);

  let html = `<defs><clipPath id="hex-clip"><polygon points="${hexOutlinePts}"/></clipPath></defs>`;

  // Layer 0: Diamond outlines (all valid positions), clipped to hexagon
  html += `<g clip-path="url(#hex-clip)">`;
  for (let t = 0; t < 3; t++) {
    for (const [k1, k2] of allDiamondPairs[t]) {
      const tri1 = grid[k1], tri2 = grid[k2];
      const pts = getDiamondOutlinePts(tri1, tri2);
      const ptsStr = pts.map(p => p.join(',')).join(' ');
      html += `<polygon points="${ptsStr}" fill="none" stroke="#bbb" stroke-width="0.8" pointer-events="none"/>`;
    }
  }
  html += `</g>`;

  // Layer 1: Fill polygons (no stroke, just color)
  for (const tri of allTris) {
    const ptsStr = tri.pts.map(p => p.join(',')).join(' ');
    const dIdx = triToDiamond[tri.key];
    let fill = 'transparent';
    if (dIdx !== undefined && diamonds[dIdx]) {
      fill = colors[diamonds[dIdx].color];
    }
    html += `<polygon points="${ptsStr}" fill="${fill}" stroke="none" style="cursor:pointer;" data-key="${tri.key}" onmousedown="onClickTri('${tri.key}')" onmouseenter="onHoverTri('${tri.key}')" onmouseleave="onLeaveTri()"/>`;
  }

  // Layer 2: Grid lines on top
  for (const [a, b] of gridLines) {
    html += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--color-border-secondary)" stroke-width="0.5" pointer-events="none"/>`;
  }

  // Layer 3: Hex outline on top of everything
  html += `<polygon points="${hexOutlinePts}" fill="none" stroke="var(--color-text-primary)" stroke-width="2" stroke-linejoin="round" pointer-events="none"/>`;

  svg.innerHTML = html;

  const counts = countByType();
  document.getElementById('count').textContent = counts[0] + counts[1] + counts[2];
  document.getElementById('cnt0').textContent = counts[0];
  document.getElementById('cnt1').textContent = counts[1];
  document.getElementById('cnt2').textContent = counts[2];
}

let hoverPair = [];

function onHoverTri(key) {
  clearHover();
  if (triToDiamond[key] !== undefined) return;
  const tri = grid[key];
  if (!tri) return;
  const partner = getPartner(tri, currentTool);
  if (!partner) return;
  hoverPair = [key, partner.key];
  for (const k of hoverPair) {
    const el = document.querySelector(`[data-key="${k}"]`);
    if (el) el.style.fill = hoverColors[currentTool];
  }
}

function onLeaveTri() { clearHover(); }

function clearHover() {
  for (const k of hoverPair) {
    const el = document.querySelector(`[data-key="${k}"]`);
    if (el && triToDiamond[k] === undefined) el.style.fill = 'transparent';
  }
  hoverPair = [];
}

function onClickTri(key) {
  if (triToDiamond[key] !== undefined) {
    removeDiamond(triToDiamond[key]);
    render();
    return;
  }
  const tri = grid[key];
  if (!tri) return;
  const partner = getPartner(tri, currentTool);
  if (!partner) return;
  placeDiamond(tri, partner, currentTool);
  render();
}

function selectTool(t) {
  currentTool = t;
  document.querySelectorAll('.tool-btn').forEach((b, i) => b.classList.toggle('active', i === t));
}

function resetBoard() {
  diamonds = [];
  triToDiamond = {};
  render();
}

function changeN(val) {
  N = Math.max(1, Math.min(10, parseInt(val) || 4));
  document.getElementById('nVal').textContent = N;
  rowConfig = buildRowConfig(N);
  diamonds = [];
  triToDiamond = {};
  neighborMaps = [{}, {}, {}];
  allDiamondPairs = [[], [], []];
  buildGrid();
  buildNeighborMaps();
  buildAllDiamondPairs();
  buildGridLines();
  buildHexOutline();
  render();
}

buildGrid();
buildNeighborMaps();
buildAllDiamondPairs();
buildGridLines();
buildHexOutline();
render();
</script>
